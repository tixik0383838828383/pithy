package com.malaclord.pitchy.mixin;

import com.malaclord.pitchy.client.PitchyClient;
import net.minecraft.client.network.ClientPlayerEntity;
import net.minecraft.entity.Entity;
import net.minecraft.util.math.MathHelper;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Shadow;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

@Mixin(Entity.class)
public abstract class ChangeDirectionMixin {

    @Shadow private float yaw;
    @Shadow private float pitch;
    @Shadow public float prevYaw;
    @Shadow public float prevPitch;

    @Inject(method = "changeLookDirection", at = @At("HEAD"), cancellable = true)
    private void overridePitch(double cursorDeltaX, double cursorDeltaY, CallbackInfo ci) {
        if (!PitchyClient.enabled || !((Object) this instanceof ClientPlayerEntity)) {
            return;
        }

        // Once pitch goes past a full half-turn, wrap it back by 360° in the
        // direction it overshot, so the float never grows without bound.
        if (MathHelper.abs(this.pitch) > 180.0f) {
            this.pitch = (-MathHelper.sign((double) this.pitch) * 180)
                    + (this.pitch - (MathHelper.sign((double) this.pitch) * 180));
            this.prevPitch = (-MathHelper.sign((double) this.prevPitch) * 180)
                    + (this.prevPitch - (MathHelper.sign((double) this.prevPitch) * 180));
        }

        float changePitch = (float) cursorDeltaY * 0.15f;
        float changeYaw = (float) cursorDeltaX * 0.15f;

        // Pitch is updated first, then checked: past the vertical (90°) the
        // horizontal mouse axis is mirrored, otherwise "upside down" looking
        // makes left/right feel reversed. Order matches the original 1.20.1 logic.
        this.pitch += changePitch;
        this.yaw += MathHelper.abs(this.pitch) % 360.0f > 90.0f ? -changeYaw : changeYaw;

        this.prevPitch += changePitch;
        this.prevYaw += MathHelper.abs(this.pitch) % 360.0f > 90.0f ? -changeYaw : changeYaw;

        ci.cancel();
    }
}
